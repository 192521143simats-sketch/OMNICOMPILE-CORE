name: Verify OmniCompile Core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
  deployment-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate Kubernetes manifests without a cluster
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/omnicompile-manifest-tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl -o "$tools/kubectl"
          curl -fsSL --retry 3 https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o "$tools/kubeconform.tar.gz"
          (
            cd "$tools"
            sha256sum --check <<'CHECKSUMS'
          629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  kubectl
          9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz
          CHECKSUMS
            chmod +x kubectl
            tar -xzf kubeconform.tar.gz kubeconform
          )
          "$tools/kubectl" kustomize infra/kubernetes > "$RUNNER_TEMP/omnicompile-manifests.yaml"
          "$tools/kubectl" kustomize infra/kubernetes-native > "$RUNNER_TEMP/omnicompile-native.yaml"
          "$tools/kubeconform" -strict -summary -kubernetes-version 1.36.1 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/3f9a43d91bb63cd92fc8e3e7201302138eec072f/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json' \
            "$RUNNER_TEMP/omnicompile-manifests.yaml" "$RUNNER_TEMP/omnicompile-native.yaml" infra/kubernetes/migration-job.yaml
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYSQL_ROOT_PASSWORD: ci-ephemeral-database-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CI-Ephemeral-Admin!4726
      PUBLIC_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Compose without storing credentials
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-placeholder
          ADMIN_PASSWORD: ci-ephemeral-placeholder
        run: docker compose config --quiet
      - run: npm ci
      - name: Prepare ephemeral container secrets
        run: |
          mkdir -p .runtime/docker/cloud-workers .runtime/docker/distribution .runtime/docker/secrets
          openssl rand -hex 32 > .runtime/docker/secrets/compiler.token
          openssl rand -hex 32 > .runtime/docker/secrets/executor.token
          openssl rand -hex 20 > .runtime/docker/secrets/artifacts-access.token
          openssl rand -hex 32 > .runtime/docker/secrets/artifacts-secret.token
          touch .runtime/docker/cloud-workers/c.credential .runtime/docker/cloud-workers/python.credential .runtime/docker/cloud-workers/java.credential
      - run: docker compose build
      - run: node infra/docker/verification/Verify-Images.mjs
      - run: docker compose up -d --wait --wait-timeout 240
      - run: node infra/docker/operations/Provision-Cloud-Workers.mjs
      - run: docker compose restart omnicompile-c-worker omnicompile-python-worker omnicompile-java-worker
      - run: node infra/docker/verification/Verify-Docker-Compilers.mjs
      - run: node infra/docker/verification/Verify-Docker-Execution.mjs
      - if: always()
        run: docker compose stop
      # No registry publishing, infrastructure creation or deployment is performed.
