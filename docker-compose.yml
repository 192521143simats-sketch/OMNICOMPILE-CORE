name: omnicompile
services:
  omnicompile-mysql:
    image: omnicompile-mysql:8.4
    container_name: omnicompile-mysql
    build:
      context: .
      dockerfile: infra/docker/images/mysql/Dockerfile
    restart: unless-stopped
    ports:
    - 127.0.0.1:3307:3307
    environment:
      MYSQL_DATABASE: ${DB_NAME:-omnicompile}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ignored
        .env}
      MYSQL_ROOT_HOST: '%'
    volumes:
    - omnicompile-mysql-data:/var/lib/mysql
    mem_limit: 768m
    command:
    - mysqld
    - --port=3307
    - --bind-address=0.0.0.0
    - --mysqlx=OFF
    - --innodb-buffer-pool-size=128M
    logging: &id001
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - storage
  omnicompile-coordinator:
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: &id002
    - no-new-privileges:true
    cap_drop: &id003
    - ALL
    logging: *id001
    image: omnicompile-coordinator:local
    container_name: omnicompile-coordinator
    build:
      context: .
      dockerfile: infra/docker/images/coordinator/Dockerfile
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 768m
    stop_grace_period: 45s
    volumes:
    - type: bind
      source: ./.runtime/docker/distribution
      target: /app/.runtime/distribution
      read_only: true
    secrets:
    - compiler-token
    - executor-token
    - artifacts-access
    - artifacts-secret
    environment:
      DB_HOST: omnicompile-mysql
      DB_PORT: '3307'
      DB_NAME: ${DB_NAME:-omnicompile}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ignored .env}
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: '4100'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      COORDINATOR_PUBLIC_URL: ${COORDINATOR_PUBLIC_URL:-http://localhost:4100}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      OMNICOMPILE_MIGRATION_MODE: check
      OMNICOMPILE_REQUIRE_ADMIN_APPROVAL: 'true'
      OMNICOMPILE_EXECUTION_MODE: docker-broker
      OMNICOMPILE_EXECUTOR_URL: http://omnicompile-executor:4102
      OMNICOMPILE_EXECUTOR_TOKEN_FILE: /run/secrets/executor-token
      OMNICOMPILE_COMPILER_TOKEN_FILE: /run/secrets/compiler-token
      OMNICOMPILE_C_COMPILER_URL: http://omnicompile-c-worker:4101
      OMNICOMPILE_PYTHON_COMPILER_URL: http://omnicompile-python-worker:4101
      OMNICOMPILE_JAVA_COMPILER_URL: http://omnicompile-java-worker:4101
      RESEND_ENABLED: 'false'
      POSTHOG_ENABLED: 'false'
      OMNICOMPILE_ARTIFACT_ENDPOINT: http://omnicompile-artifacts:9000
      OMNICOMPILE_ARTIFACT_BUCKET: omnicompile-artifacts
      OMNICOMPILE_ARTIFACT_ACCESS_KEY_FILE: /run/secrets/artifacts-access
      OMNICOMPILE_ARTIFACT_SECRET_KEY_FILE: /run/secrets/artifacts-secret
      OMNICOMPILE_ARTIFACT_RECONCILE_INTERVAL_MS: '3600000'
      OMNICOMPILE_ARTIFACT_ORPHAN_GRACE_HOURS: '24'
      OMNICOMPILE_ARTIFACT_RECONCILE_LIMIT: '100'
    ports:
    - 4100:4100
    depends_on:
      omnicompile-mysql:
        condition: service_healthy
      omnicompile-executor:
        condition: service_healthy
      omnicompile-artifacts:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4100/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
    - default
    - storage
  omnicompile-frontend:
    restart: unless-stopped
    init: true
    read_only: false
    security_opt: *id002
    cap_drop: *id003
    logging: *id001
    image: omnicompile-frontend:local
    container_name: omnicompile-frontend
    build:
      context: .
      dockerfile: infra/docker/images/frontend/Dockerfile
    environment:
      COORDINATOR_UPSTREAM: omnicompile-coordinator:4100
    ports:
    - 5173:8080
    depends_on:
      omnicompile-coordinator:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 12
  omnicompile-c-worker:
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    logging: *id001
    image: omnicompile-c-worker:local
    container_name: omnicompile-c-worker
    build:
      context: .
      dockerfile: infra/docker/images/workers/Dockerfile
      target: c-worker
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    environment:
      OMNICOMPILE_WORKER_LANGUAGE: c
      OMNICOMPILE_COMPILER_TOKEN_FILE: /run/secrets/compiler-token
      OMNICOMPILE_EXECUTOR_URL: http://omnicompile-executor:4102
      OMNICOMPILE_EXECUTOR_TOKEN_FILE: /run/secrets/executor-token
      WORKER_CREDENTIAL_FILE: /run/secrets/worker-credential
      COORDINATOR_URL: http://omnicompile-coordinator:4100
    volumes:
    - ./.runtime/docker/cloud-workers/c.credential:/run/secrets/worker-credential:ro
    secrets:
    - compiler-token
    - executor-token
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4101/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  omnicompile-python-worker:
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    logging: *id001
    image: omnicompile-python-worker:local
    container_name: omnicompile-python-worker
    build:
      context: .
      dockerfile: infra/docker/images/workers/Dockerfile
      target: python-worker
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    environment:
      OMNICOMPILE_WORKER_LANGUAGE: python
      OMNICOMPILE_COMPILER_TOKEN_FILE: /run/secrets/compiler-token
      OMNICOMPILE_EXECUTOR_URL: http://omnicompile-executor:4102
      OMNICOMPILE_EXECUTOR_TOKEN_FILE: /run/secrets/executor-token
      WORKER_CREDENTIAL_FILE: /run/secrets/worker-credential
      COORDINATOR_URL: http://omnicompile-coordinator:4100
    volumes:
    - ./.runtime/docker/cloud-workers/python.credential:/run/secrets/worker-credential:ro
    secrets:
    - compiler-token
    - executor-token
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4101/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  omnicompile-java-worker:
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    logging: *id001
    image: omnicompile-java-worker:local
    container_name: omnicompile-java-worker
    build:
      context: .
      dockerfile: infra/docker/images/workers/Dockerfile
      target: java-worker
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    environment:
      OMNICOMPILE_WORKER_LANGUAGE: java
      OMNICOMPILE_COMPILER_TOKEN_FILE: /run/secrets/compiler-token
      OMNICOMPILE_EXECUTOR_URL: http://omnicompile-executor:4102
      OMNICOMPILE_EXECUTOR_TOKEN_FILE: /run/secrets/executor-token
      WORKER_CREDENTIAL_FILE: /run/secrets/worker-credential
      COORDINATOR_URL: http://omnicompile-coordinator:4100
    volumes:
    - ./.runtime/docker/cloud-workers/java.credential:/run/secrets/worker-credential:ro
    secrets:
    - compiler-token
    - executor-token
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4101/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  omnicompile-executor:
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    logging: *id001
    image: omnicompile-executor:local
    container_name: omnicompile-executor
    build:
      context: .
      dockerfile: infra/docker/images/executor/Dockerfile
      additional_contexts:
        coordinator: service:omnicompile-coordinator
    user: 0:0
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    mem_limit: 256m
    pids_limit: 64
    secrets:
    - executor-token
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      OMNICOMPILE_EXECUTOR_TOKEN_FILE: /run/secrets/executor-token
      DOCKER_CONFIG: /tmp/docker
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4102/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    stop_grace_period: 45s
  omnicompile-artifacts:
    image: omnicompile-artifacts:local
    container_name: omnicompile-artifacts
    build:
      context: .
      dockerfile: infra/docker/images/artifact-service/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    volumes:
    - omnicompile-artifacts-data:/data
    secrets:
    - artifacts-access
    - artifacts-secret
    networks:
    - storage
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q 'HTTP/1.1 403'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
volumes:
  omnicompile-mysql-data:
    name: OMNICOMPILE-MYSQL
  omnicompile-artifacts-data:
    name: OMNICOMPILE-ARTIFACTS
networks:
  default:
    name: omnicompile-network
  storage:
    name: omnicompile-storage-network
secrets:
  compiler-token:
    file: ./.runtime/docker/secrets/compiler.token
  executor-token:
    file: ./.runtime/docker/secrets/executor.token
  artifacts-access:
    file: ./.runtime/docker/secrets/artifacts-access.token
  artifacts-secret:
    file: ./.runtime/docker/secrets/artifacts-secret.token
