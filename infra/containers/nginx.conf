server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Join URLs carry admission identifiers; avoid recording URL paths in access logs.
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  client_max_body_size 2m;
  resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ {
    set $api ${COORDINATOR_UPSTREAM};
    proxy_pass http://$api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location /ws {
    set $api ${COORDINATOR_UPSTREAM};
    proxy_pass http://$api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
}
