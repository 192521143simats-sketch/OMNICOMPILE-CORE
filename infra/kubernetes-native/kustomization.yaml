apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../kubernetes
- execution.yaml
patches:
- target:
    kind: ConfigMap
    name: omnicompile-config
  patch: |
    - op: replace
      path: /data/OMNICOMPILE_EXECUTOR_URL
      value: http://omnicompile-executor:4102
- target:
    kind: NetworkPolicy
    name: omnicompile-compiler-ingress
  patch: |
    - op: add
      path: /spec/egress/-
      value:
        to:
        - podSelector:
            matchLabels:
              app: omnicompile-executor
        ports:
        - {protocol: TCP, port: 4102}
- target:
    kind: NetworkPolicy
    name: omnicompile-mysql-internal-only
  patch: |
    - op: add
      path: /spec/ingress/0/from/-
      value:
        podSelector:
          matchLabels:
            app: omnicompile-executor
