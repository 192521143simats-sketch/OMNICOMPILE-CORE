apiVersion: v1
kind: Namespace
metadata:
  name: omnicompile-execution
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: execution-capacity, namespace: omnicompile-execution}
spec:
  hard:
    count/jobs.batch: "2"
    count/configmaps: "80"
    pods: "2"
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deny-all, namespace: omnicompile-execution}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: execution-broker, namespace: omnicompile}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: execution-broker, namespace: omnicompile-execution}
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: execution-broker, namespace: omnicompile-execution}
subjects:
- {kind: ServiceAccount, name: execution-broker, namespace: omnicompile}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: execution-broker}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: omnicompile-executor, namespace: omnicompile}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: omnicompile-executor}
  template:
    metadata:
      labels: {app: omnicompile-executor}
    spec:
      serviceAccountName: execution-broker
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
      - name: broker
        image: omnicompile-coordinator:local
        command: [node, --import, tsx, apps/coordinator/src/docker-executor.ts]
        ports: [{name: http, containerPort: 4102}]
        envFrom:
        - configMapRef: {name: omnicompile-config}
        env:
        - {name: OMNICOMPILE_EXECUTION_PROVIDER, value: kubernetes}
        - {name: OMNICOMPILE_SANDBOX_RUNTIME_CLASS, value: gvisor}
        - {name: OMNICOMPILE_ARTIFACT_ENDPOINT, value: ""}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: omnicompile-runtime, key: DB_PASSWORD}}}
        - {name: OMNICOMPILE_EXECUTOR_IMAGE_C, valueFrom: {configMapKeyRef: {name: execution-images, key: c}}}
        - {name: OMNICOMPILE_EXECUTOR_IMAGE_PYTHON, valueFrom: {configMapKeyRef: {name: execution-images, key: python}}}
        - {name: OMNICOMPILE_EXECUTOR_IMAGE_JAVA, valueFrom: {configMapKeyRef: {name: execution-images, key: java}}}
        readinessProbe: {httpGet: {path: /ready, port: http}, timeoutSeconds: 5}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
        - {name: token, mountPath: /run/executor, readOnly: true}
        - {name: temp, mountPath: /tmp}
      volumes:
      - {name: token, secret: {secretName: omnicompile-executor, defaultMode: 288}}
      - {name: temp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: omnicompile-executor, namespace: omnicompile}
spec:
  selector: {app: omnicompile-executor}
  ports: [{name: http, port: 4102, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: execution-broker-ingress, namespace: omnicompile}
spec:
  podSelector:
    matchLabels: {app: omnicompile-executor}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: omnicompile-coordinator}}
    - podSelector: {matchLabels: {omnicompile-role: compiler}}
    ports: [{protocol: TCP, port: 4102}]
