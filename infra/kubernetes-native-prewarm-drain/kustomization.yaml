apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../kubernetes-native-prewarm
patches:
- target:
    kind: Deployment
    name: omnicompile-executor
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: omnicompile-executor
    spec:
      template:
        spec:
          containers:
            - name: broker
              env:
                - name: OMNICOMPILE_PREWARM_ENABLED
                  value: "0"
