apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnicompile-compiler-ingress
  namespace: omnicompile
spec:
  podSelector:
    matchLabels:
      omnicompile-role: compiler
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: omnicompile-coordinator
    ports:
    - protocol: TCP
      port: 4101
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: omnicompile-coordinator
    ports:
    - protocol: TCP
      port: 4100
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
