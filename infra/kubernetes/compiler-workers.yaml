# Preparation only. No resources have been deployed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnicompile-c-worker
  namespace: omnicompile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnicompile-c-worker
  template:
    metadata:
      labels:
        app: omnicompile-c-worker
        omnicompile-role: compiler
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: omnicompile-c-worker
        image: omnicompile-c-worker:local
        ports:
        - containerPort: 4101
          name: compiler
        env:
        - name: COORDINATOR_URL
          value: http://omnicompile-coordinator:4100
        - name: OMNICOMPILE_COMPILER_LANGUAGE
          value: c
        - name: OMNICOMPILE_WORKER_LANGUAGE
          value: c
        - name: OMNICOMPILE_COMPILER_TOKEN_FILE
          value: /run/secrets/compiler-token
        - name: WORKER_CREDENTIAL_FILE
          value: /run/worker/credential
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 256Mi
        volumeMounts:
        - name: work
          mountPath: /tmp
        - name: compiler-token
          mountPath: /run/secrets
          readOnly: true
        - name: worker-credential
          mountPath: /run/worker
          readOnly: true
        startupProbe:
          httpGet:
            path: /ready
            port: compiler
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: compiler
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: compiler
          periodSeconds: 15
          failureThreshold: 6
      volumes:
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: compiler-token
        secret:
          secretName: omnicompile-compiler
          defaultMode: 288
          items:
          - key: token
            path: compiler-token
      - name: worker-credential
        secret:
          secretName: omnicompile-c-worker-identity
          optional: true
          defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: omnicompile-c-worker
  namespace: omnicompile
spec:
  selector:
    app: omnicompile-c-worker
  ports:
  - name: compiler
    port: 4101
    targetPort: compiler
---
