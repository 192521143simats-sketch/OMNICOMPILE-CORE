# Render separately; never keep an already-completed migration Job in app rollout.
apiVersion: batch/v1
kind: Job
metadata: {name: omnicompile-migrate-release, namespace: omnicompile}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app: migration}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: migrate
          image: omnicompile-coordinator:local
          command: [node, --import, tsx, apps/coordinator/src/migrate.ts]
          envFrom: [{configMapRef: {name: omnicompile-config}}]
          env:
            - {name: OMNICOMPILE_MIGRATION_MODE, value: apply}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: omnicompile-migrations, key: DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: omnicompile-migrations, key: DB_PASSWORD}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: temporary-work, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: temporary-work
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
