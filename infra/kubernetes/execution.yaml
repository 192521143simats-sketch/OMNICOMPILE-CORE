# Namespace is explicit because executor workloads must never share app secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: omnicompile-execution
  labels:
    omnicompile.execution: sandbox
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: omnicompile-coordinator, namespace: omnicompile}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: omnicompile-executor, namespace: omnicompile-execution}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: omnicompile-executor, namespace: omnicompile-execution}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: omnicompile-executor}
subjects: [{kind: ServiceAccount, name: omnicompile-coordinator, namespace: omnicompile}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: execution-deny-all, namespace: omnicompile-execution}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: execution-budget, namespace: omnicompile-execution}
spec:
  hard:
    pods: "2"
    count/jobs.batch: "4"
    configmaps: "128"
    requests.cpu: "2"
    limits.cpu: "2"
    requests.memory: 512Mi
    limits.memory: 1Gi
---
# Requires Kubernetes >=1.30 and the verified RuntimeClass to be installed first.
# A Job-create Role cannot constrain Pod specs: admission enforces this boundary.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: omnicompile-execution-boundary}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor'"
      message: A verified sandbox RuntimeClass is mandatory.
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: Sandbox pods must not receive Kubernetes credentials.
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || (has(v.projected) && v.projected.sources.all(s, has(s.configMap))))"
      message: Only ephemeral workspaces and ConfigMap payloads are allowed.
    - expression: "(!has(object.spec.initContainers) || object.spec.initContainers.all(c, has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits && 'memory' in c.resources.limits))"
      message: All init containers require CPU and memory limits.
    - expression: "!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0"
      message: Ephemeral debug containers are forbidden in the execution namespace.
    - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits && 'memory' in c.resources.limits)"
      message: All sandbox containers require CPU and memory limits.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: omnicompile-execution-boundary}
spec:
  policyName: omnicompile-execution-boundary
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {omnicompile.execution: sandbox}
