apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: ResourceQuota
    name: execution-capacity
  patch: |
    - op: replace
      path: /spec/hard
      value:
        count/jobs.batch: "2"
        count/configmaps: "82"
        pods: "5"
        requests.cpu: "1250m"
        requests.memory: 1280Mi
        limits.cpu: "5"
        limits.memory: 2560Mi
- target:
    kind: Role
    name: execution-broker
    namespace: omnicompile-execution
  patch: |
    - op: add
      path: /rules/1/verbs/-
      value: list
    - op: add
      path: /rules/1/verbs/-
      value: delete
    - op: add
      path: /rules/2/verbs/-
      value: create
    - op: add
      path: /rules/2/verbs/-
      value: get
    - op: add
      path: /rules/2/verbs/-
      value: delete
    - op: add
      path: /rules/-
      value:
        apiGroups: [""]
        resources: [resourcequotas]
        resourceNames: [execution-capacity]
        verbs: [get]
- target:
    kind: Deployment
    name: omnicompile-executor
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: omnicompile-executor
    spec:
      template:
        spec:
          containers:
            - name: broker
              env:
                - name: OMNICOMPILE_PREWARM_ENABLED
                  value: "1"
                - name: OMNICOMPILE_PREWARM_POLICY
                  value: demand
